<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe7">
  <meta name="description" content="東華三院 1870 創院場景 3D 模型互動展示。">
  <title>1870 東華三院｜創院場景 3D 展示</title>
  <style>
    :root { color-scheme: light; --ink:#25312e; --muted:#6c7771; --paper:#f3efe7; --line:rgba(37,49,46,.15); --red:#a44a3f; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif; }
    #stage { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; outline:none; }
    .topbar { position:fixed; z-index:2; left:clamp(20px,5vw,72px); right:clamp(20px,5vw,72px); top:28px; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
    .brand { display:flex; align-items:center; gap:13px; pointer-events:auto; }
    .seal { width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--red); color:var(--red); font-family:serif; font-size:19px; border-radius:50%; }
    .brand-name { font-size:12px; letter-spacing:.18em; font-weight:650; }
    .brand-sub { color:var(--muted); font-size:10px; letter-spacing:.15em; margin-top:4px; }
    .top-note { text-align:right; font-size:10px; letter-spacing:.16em; color:var(--muted); line-height:1.7; }
    .intro { position:fixed; z-index:2; left:clamp(22px,7vw,104px); top:50%; transform:translateY(-50%); width:min(330px,37vw); pointer-events:none; }
    .eyebrow { display:flex; align-items:center; gap:10px; color:var(--red); font-size:10px; letter-spacing:.22em; font-weight:700; }
    .eyebrow:before { content:""; height:1px; width:28px; background:var(--red); }
    h1 { font-family: "Noto Serif TC", "Songti TC", "PMingLiU",serif; font-size:clamp(34px,5vw,64px); line-height:1.16; letter-spacing:.08em; font-weight:500; margin:20px 0 14px; }
    h1 span { display:block; font-size:.48em; letter-spacing:.18em; margin-top:9px; color:#54625c; }
    .description { color:#626d67; font-size:13px; line-height:2; letter-spacing:.04em; max-width:290px; }
    .year { margin-top:32px; padding-top:14px; border-top:1px solid var(--line); display:flex; gap:14px; align-items:baseline; color:var(--muted); font-size:10px; letter-spacing:.16em; }
    .year strong { font-family:Georgia,serif; color:var(--ink); font-size:22px; font-weight:400; letter-spacing:.08em; }
    .controls { position:fixed; z-index:3; right:clamp(20px,5vw,72px); bottom:30px; display:flex; gap:8px; }
    button { appearance:none; border:1px solid var(--line); background:rgba(248,246,240,.82); color:var(--ink); padding:10px 14px; border-radius:2px; font:inherit; font-size:11px; letter-spacing:.08em; cursor:pointer; backdrop-filter:blur(8px); transition:background .2s,border-color .2s,transform .2s; }
    button:hover { background:#fff; border-color:rgba(37,49,46,.36); transform:translateY(-1px); }
    button:focus-visible { outline:2px solid var(--red); outline-offset:3px; }
    .hint { position:fixed; z-index:2; bottom:35px; left:clamp(22px,7vw,104px); font-size:10px; letter-spacing:.12em; color:#78817b; pointer-events:none; }
    .hint span { color:var(--red); margin-right:8px; }
    .status { position:fixed; z-index:4; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:12px; letter-spacing:.1em; padding:12px 16px; background:rgba(243,239,231,.88); border:1px solid var(--line); }
    .status.error { color:#8d3027; max-width:min(90vw,460px); line-height:1.7; text-align:center; }
    .vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:linear-gradient(90deg,rgba(243,239,231,.86) 0%,rgba(243,239,231,.56) 29%,transparent 54%),linear-gradient(0deg,rgba(243,239,231,.38),transparent 20%,transparent 80%,rgba(243,239,231,.28)); }
    @media (max-width:700px) {
      .topbar { top:18px; } .seal { width:36px;height:36px;font-size:16px; } .brand-name{font-size:10px}.brand-sub{font-size:9px}.top-note{font-size:8px}
      .intro { top:auto; bottom:95px; transform:none; width:min(280px,76vw); left:22px; }
      h1 { font-size:38px; margin:12px 0 8px; } .description { font-size:11px; line-height:1.8; max-width:250px; }
      .year { margin-top:14px; padding-top:8px; } .year strong{font-size:18px}
      .hint { display:none; } .controls { right:18px; bottom:20px; gap:6px; } button{padding:9px 10px;font-size:10px}
      .vignette { background:linear-gradient(0deg,rgba(243,239,231,.94) 0%,rgba(243,239,231,.68) 34%,transparent 68%,rgba(243,239,231,.2)); }
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="可旋轉及縮放的東華三院創院場景 3D 模型"></div>
  <div class="vignette"></div>
  <header class="topbar">
    <div class="brand"><div class="seal" aria-hidden="true">東</div><div><div class="brand-name">東華三院</div><div class="brand-sub">TUNG WAH GROUP OF HOSPITALS</div></div></div>
    <div class="top-note">歷史場景數碼重塑<br>INTERACTIVE 3D MODEL</div>
  </header>
  <main class="intro">
    <div class="eyebrow">創院場景 · 互動模型</div>
    <h1>東華三院<span>FOUNDING SCENE</span></h1>
    <p class="description">以三維模型重現東華三院創院初期的建築場景。拖曳以環視，滾輪或雙指手勢縮放，探索昔日院舍風貌。</p>
    <div class="year"><strong>1870</strong><span>香港 · 上環</span></div>
  </main>
  <div class="hint"><span>↻</span>拖曳環視　·　滾輪縮放　·　右鍵平移</div>
  <div class="controls" aria-label="模型控制">
    <button id="reset" type="button">重設視角</button>
    <button id="rotate" type="button" aria-pressed="false">自動旋轉</button>
    <button id="fullscreen" type="button">全螢幕</button>
  </div>
  <div id="status" class="status" role="status">正在載入 3D 模型…</div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const stage = document.querySelector('#stage');
    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f3efe7');
    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    stage.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xfff6e7, 0x737b78, 2.0));
    const key = new THREE.DirectionalLight(0xffeed6, 3.1);
    key.position.set(-8, 15, 11); scene.add(key);
    const fill = new THREE.DirectionalLight(0xcbd9e2, 1.35);
    fill.position.set(12, 8, -10); scene.add(fill);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: '#e7e1d6', roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.03; scene.add(ground);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.06; controls.screenSpacePanning = true;
    controls.minDistance = 1; controls.maxDistance = 1000; controls.autoRotateSpeed = 0.55;
    controls.target.set(0, 0, 0);

    let model;
    let initialPosition;
    new GLTFLoader().load('./assets/tung-wah-1870.glb', (gltf) => {
      model = gltf.scene;
      model.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(model);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      // Center the model while keeping the original dimensions and orientation.
      model.position.sub(center);
      model.position.y += size.y / 2;
      scene.add(model);
      controls.target.set(0, size.y * 0.42, 0);
      const maxDim = Math.max(size.x, size.y, size.z);
      const distance = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.25;
      camera.position.set(distance * 0.9, distance * 0.62, distance * 1.18);
      camera.near = Math.max(maxDim / 1000, 0.01); camera.far = maxDim * 30; camera.updateProjectionMatrix();
      controls.minDistance = maxDim * 0.08; controls.maxDistance = maxDim * 8;
      controls.update(); initialPosition = camera.position.clone();
      status.remove();
    }, (event) => {
      if (event.total) status.textContent = `正在載入 3D 模型… ${Math.round(event.loaded / event.total * 100)}%`;
    }, (error) => {
      console.error(error);
      status.classList.add('error');
      status.textContent = '模型載入失敗。請確認 assets/tung-wah-1870.glb 與 index.html 一同上傳，並透過 GitHub Pages 或本機伺服器開啟。';
    });

    document.querySelector('#reset').addEventListener('click', () => {
      if (!model) return;
      camera.position.copy(initialPosition); controls.target.set(0, model.position.y * 0.84, 0); controls.update();
    });
    const rotateButton = document.querySelector('#rotate');
    rotateButton.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      rotateButton.setAttribute('aria-pressed', String(controls.autoRotate));
      rotateButton.textContent = controls.autoRotate ? '停止旋轉' : '自動旋轉';
    });
    document.querySelector('#fullscreen').addEventListener('click', async () => {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      else await document.exitFullscreen?.();
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
